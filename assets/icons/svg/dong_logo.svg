<?xml version="1.0" encoding="utf-8"?>
<svg id="dong-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702.89 283" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">DONG football gong logo</title>
  <desc id="logo-description">Blue DONG lettering with a gold gong and football replacing the letter O.</desc>
  <defs>
    <style id="logo-palette">
      /* Blue lettering and frame accents */
      .blue-mid { fill: #3c68a7; }
      .blue-dark { fill: #1b58a5; }
      .blue-light { fill: #4376b2; }
      .blue-primary { fill: #2c6ab0; }
      .blue-highlight { fill: #85a3c8; }
      .blue-deep { fill: #10458f; }
      .blue-deep-shadow { fill: #144390; }
      .blue-muted { fill: #3560a0; }
      .blue-secondary { fill: #245fa6; }
      .blue-foot-shadow { fill: #2d4a81; }

      /* Gong and football */
      .gold-bright { fill: #fccb15; }
      .gold-shadow { fill: #d5ac19; }
      .charcoal { fill: #2b2a2c; }
      .near-black { fill: #010101; }
      .white-detail { fill: #fff; }
      .warm-highlight { fill: #fcfade; }

      /* Metal frame */
      .metal-gray { fill: #9ea0a4; }
      .metal-light { fill: #b7b6bb; }
      .silver-highlight { fill: #dcdadb; }

      /* Fine outline around the gong face */
      .dark-outline {
        fill: none;
        stroke: #302c2f;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.43px;
      }
    </style>
