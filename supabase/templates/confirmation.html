<h2>Confirm your DONG account</h2>

<p>Enter this 6-digit code in the app to confirm your account:</p>

<p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; text-align: center;">
  {{ .Token }}
</p>

<p>Or click the link below to confirm directly:</p>

<p><a href="{{ .ConfirmationURL }}">Confirm my account</a></p>

<p style="color: #6c757d; font-size: 13px;">
  This code expires in 1 hour. If you did not create a DONG account, you can safely ignore this email.
</p>
