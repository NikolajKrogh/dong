name: command-api security scan

# OWASP dependency-check is slow (downloads the NVD database) so it runs on a
# weekly schedule and on demand, rather than blocking every pull request.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-api
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.2
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: OWASP dependency-check
        env:
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw --batch-mode --no-transfer-progress -Psecurity verify
