  jwks-url: ${SUPABASE_JWKS_URL}
  url: ${SUPABASE_URL}
  anon-key: ${SUPABASE_ANON_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
