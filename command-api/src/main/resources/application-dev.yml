# Dev-only profile. Activate with: --spring.profiles.active=dev
# CORS is intentionally scoped here (grep-able) and NEVER applied silently in prod.
# Consumed by SecurityConfig via CorsProperties-style binding.
command-api:
  cors:
    enabled: true
    # Origin *patterns* (see SecurityConfig#corsConfigurationSource). `[*]` matches
    # any port, because the Expo web dev server falls through to 8082/8083/... when
    # 8081 is taken and an exact list breaks with only an opaque browser
    # "NetworkError". Still dev-profile-only and still host-restricted to loopback —
    # this is not a blanket wildcard. If you browse the web build over the LAN
    # instead of loopback, add that origin here (e.g. http://10.0.0.3:[*]).
    allowed-origins:
      - http://localhost:[*]    # Expo web dev server, any port
      - http://127.0.0.1:[*]
    allowed-methods:
      - GET
      - POST
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Idempotency-Key
      - X-Request-Id
